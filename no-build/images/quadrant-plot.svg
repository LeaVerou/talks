		<path d="M-7.61 598.35 C-5.31 602.66, -4.46 611.29, 0.95 621.84 M-7.61 598.35 C-6.25 604.59, -2.5 610.1, 0.95 621.84"></path>
		<path d="M9.49 598.34 C7.19 602.81, 3.45 611.43, 0.95 621.84 M9.49 598.34 C6.67 604.56, 6.24 610.07, 0.95 621.84"></path>
	</g>

	<!-- Horizontal axis, arrows on both ends -->
	<g class="axis" transform="translate(-337.14 0.17)">
		<path d="M0.39 -1 C117.46 -1.12, 586.2 -0.59, 703.31 -0.51 M-0.86 1.1 C116.5 1.11, 587.87 0.85, 705.58 0.77"></path>
		<path d="M23.89 -9.53 C13.36 -7.64, 5.29 -4.78, 0.39 -1 M23.89 -9.53 C17.17 -7.65, 11.87 -6.1, 0.39 -1"></path>
		<path d="M23.88 7.57 C13.32 2.99, 5.26 -0.61, 0.39 -1 M23.88 7.57 C17.15 4.98, 11.85 2.05, 0.39 -1"></path>
		<path d="M682.09 9.33 C689.3 4.6, 699 0.99, 705.58 0.77 M682.09 9.33 C687.66 6.99, 694.66 4.06, 705.58 0.77"></path>
		<path d="M682.08 -7.77 C689.33 -6.03, 699.03 -3.17, 705.58 0.77 M682.08 -7.77 C687.67 -5.64, 694.67 -4.09, 705.58 0.77"></path>
	</g>

	<text x="0" y="-322" text-anchor="middle">Always</text>
	<text x="0" y="339" text-anchor="middle">Never</text>
	<text x="-300" y="28">Light</text>
	<text x="256" y="28">Heavy</text>

	<text class="hint" x="0" y="-384" text-anchor="middle">
		<tspan x="0">How frequently do</tspan>
		<tspan x="0" dy="1.25em">we need build tools?</tspan>
	</text>
	<text class="hint" x="384" y="-9">
		<tspan x="384">How complex are</tspan>
		<tspan x="384" dy="1.25em">the build tools?</tspan>
	</text>

