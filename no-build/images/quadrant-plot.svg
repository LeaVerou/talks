<svg xmlns="http://www.w3.org/2000/svg" viewBox="-348 -408 868 768">
	<!-- svg-source:excalidraw -->
	<defs>
		<style>
			@font-face {
				font-family: Excalifont;
				src: url("../../shared/fonts/Excalifont-Regular.woff2") format("woff2");
			}

			/* Position of the dot, in axis units (origin at the axes' intersection, y grows upwards).
			   Registered so that changes animate. */
			@property --x {
				syntax: "&lt;number&gt;"; /* escaped so inlining in HTML does not parse it as a tag */
				inherits: true;
				initial-value: 215;
			}

			@property --y {
				syntax: "&lt;number&gt;"; /* escaped so inlining in HTML does not parse it as a tag */
				inherits: true;
				initial-value: 215;
			}

			text {
				font: 28px Excalifont, "Segoe UI Emoji";
				fill: #1e1e1e;
			}

			.hint {
				font-size: 16px;
				fill: #868e96;
			}

			.axis {
				fill: none;
				stroke: #1e1e1e;
				stroke-width: 2;
				stroke-linecap: round;
			}

			.point {
				fill: #e03131;
				transition: --x 1s, --y 1s;
				translate: calc(var(--x) * 1px) calc(var(--y) * -1px);
			}
		</style>
	</defs>

	<!-- Vertical axis, arrows on both ends -->
	<g class="axis" transform="translate(-0.55 -309.77)">
		<path d="M1.07 -0.01 C0.94 103.45, -1.01 517.26, -1.15 620.76 M0.18 -1.06 C0.43 102.52, 1.05 518, 0.95 621.84"></path>
