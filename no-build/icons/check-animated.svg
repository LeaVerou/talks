<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
fill="none" stroke="currentColor"
stroke-width="4" >
<style>
	@keyframes draw {
		to {
			stroke-dashoffset: 0;
		}
	}

	@media not (prefers-reduced-motion: reduce) {
		path {
			animation: draw .5s cubic-bezier(.65, 0, .35, 1) .1s both;
			stroke-dashoffset: 1;
		}
	}

	#start:target ~ path,
	#end:target ~ path {
		animation-play-state: paused;
	}

	#end:target ~ path {
		animation-delay: -.5s;
	}

</style>
<g id="start"></g>
<g id="end"></g>
<path stroke-dasharray="1" pathLength="1" d="M4 12.5l5 5L20 6.5"/>
</svg>
